<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Карта</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%;
    height:100vh;
    background:#fff;
    overflow:hidden;
  }
  .wrap {
    width:100vw;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .wrap iframe {

    height:100%;
    border:none;
    display:block;
  }
</style>
</head>
<body>
  <div class="wrap">
    <iframe src="map.svg" scrolling="no"></iframe>
  </div>
</body>
</html>

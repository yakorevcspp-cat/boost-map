<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Карта</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100vh;
    background:#fff;
    overflow:hidden;
  }
  .wrap {
    width:100vw; height:100vh;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap iframe {
    width:100%; height:100%;
    border:none; display:block;
  }
</style>
</head>
<body>
  <div class="wrap">
    <iframe id="mapFrame" src="map.svg" scrolling="no"></iframe>
  </div>

  <script>
    // Регионы, где были мероприятия
    const activeRegions = [28,29,31,36,37,38,39,40,42,45,46,47,51,52,54,56,58,64,65,66,68,69,71,72,81,100,108,113,115,116,117,118,119,139,140,141,143,144,145,152];

    document.getElementById('mapFrame').addEventListener('load', function() {
      const svgDoc = this.contentDocument;
      const paths = svgDoc.querySelectorAll('path');

      paths.forEach(function(path, index) {
        // Все регионы — светло-серые
        path.style.fill = '#E0E0E0';
        path.style.transition = 'fill 0.3s ease';

        // Выбранные — жёлтые
        if (activeRegions.includes(index)) {
          path.style.fill = '#FFFE21';
        }
      });
    });
  </script>
</body>
</html>
